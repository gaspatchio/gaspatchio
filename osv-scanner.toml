# osv-scanner ignore list for transitive advisories with no available fix.
# Each entry is a deliberate, reviewed exception — revisit when upstream ships a
# fix (track via the linked advisories). Everything else is expected to be
# remediated by a lockfile bump rather than ignored.

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
reason = "bincode 2.0.1 is a transitive dependency of polars-utils; no fixed version is published. Remediation depends on an upstream polars bump."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste 1.0.15 is an 'unmaintained crate' advisory (informational, not an exploitable vulnerability); transitive with no maintained drop-in replacement available."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0176"
reason = "pyo3 out-of-bounds read in PyList/PyTuple nth/nth_back. Fixed only in pyo3 0.29.0; we are on 0.27 and cannot reach 0.29 because the polars bridge (pyo3-polars, max-stable 0.27.0) targets pyo3 0.28 at most — no pyo3 0.29 release exists yet. Our binding code (bindings/python/src) calls none of the affected APIs. Revisit when pyo3-polars ships a pyo3 0.29 build (then bump pyo3+pyo3-polars+polars together and drop this entry)."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0177"
reason = "pyo3 missing Sync bound on PyCFunction::new_closure. Fixed only in pyo3 0.29.0; blocked by the same pyo3-polars version-lock as RUSTSEC-2026-0176 (no pyo3 0.29-compatible bridge yet). We do not use PyCFunction::new_closure. Revisit when pyo3-polars ships a pyo3 0.29 build."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0194"
reason = "quick-xml is transitive via object_store <- polars 0.53; the fix (0.41.0) is capped at ^0.39 by object_store 0.13.2, so reaching it requires a polars bump blocked by the pyo3-polars version-lock (pyo3-polars 0.26 targets polars 0.53). object_store uses quick-xml only to parse XML from remote cloud stores (S3/Azure/GCS); gaspatchio reads local parquet/CSV and never exercises those backends, so the affected parser is not reached. Revisit when polars/pyo3-polars advance (then bump and drop this entry)."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0195"
reason = "quick-xml, same root cause and remediation path as RUSTSEC-2026-0194 (transitive via object_store <- polars 0.53, fix in 0.41.0 blocked by the pyo3-polars version-lock; remote-cloud XML parsing path is unused). Revisit when polars/pyo3-polars advance."

# Python advisories became visible for the first time when bindings/python/uv.lock
# started being tracked (issue #33). Before that the PR scanner had no Python
# lockfile to read and reported nothing — the risk was not new, only unmeasured.

[[IgnoredVulns]]
id = "GHSA-9xwg-3r6f-jcx2"
reason = "pymdown-extensions path traversal in the `b64` extension: an <img src> containing '../' escapes base_path and inlines the target file as base64. Fixed in 11.0.0, which is unreachable — pymdown-extensions is transitive via marimo, and marimo 0.23.13 pins pymdown-extensions>=10.21.2,<11. It reaches us only through the optional `recipes` extra, so it is absent from the published wheel's runtime closure, and exploitation additionally requires the `b64` extension to be enabled over attacker-controlled markdown, which gaspatchio never renders. Revisit when marimo relaxes its <11 cap (then bump and drop this entry)."

[[IgnoredVulns]]
id = "GHSA-gm37-52c6-37mw"
reason = "pymdown-extensions ReDoS: exponential-backtracking regexes in the caret/tilde/betterem/magiclink inline processors let a <50-byte untrusted Markdown line pin the rendering thread. Fixed only in 11.0.1, which is unreachable — same version-lock as GHSA-9xwg-3r6f-jcx2: pymdown-extensions is transitive via marimo, and marimo 0.23.13 pins pymdown-extensions>=10.21.2,<11. It reaches us only through the optional `recipes` extra, so it is absent from the published wheel's runtime closure, and exploitation requires rendering attacker-controlled markdown through those extensions, which gaspatchio never does. Revisit when marimo relaxes its <11 cap (then bump and drop this entry together with GHSA-9xwg-3r6f-jcx2)."
