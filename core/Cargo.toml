[package]
name = "gaspatchio_core_lib"
version = "1.0.0-rc.1"
edition = "2021"
license = "Apache-2.0"
# `ref` is a symlink to the repository's design-reference tree. Cargo follows
# it when it lists the package, so the core's sdist carried the whole tree,
# once through this crate and once through bindings/python.
exclude = ["ref"]

[lib]
name = "gaspatchio_core_lib"
# pure Rust library
crate-type = ["rlib"]


[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
polars = { version = "0.53.0", features = [
    "lazy",
    "dtype-categorical",
    "dtype-struct",
    "dtype-datetime",
    # Narrow integer keys must round-trip the plugin boundary; without these
    # a UInt8/UInt16 key column panics inside pyo3-polars deserialization.
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
    "parquet",
    "strings",
    "diagonal_concat",
    # The content grammar carries a fixed-width array as the list it holds.
    "dtype-array",
    # The content grammar writes a timestamp column's zone (R116); without this
    # the crate built on its own reads every zone as naive.
    "timezones",
] }
polars-arrow = "0.53.0"
polars-core = { version = "0.53.0", default-features = false }
log = "0.4.26"
env_logger = "0.11.1"
arc-swap = "1.6.0"
thiserror = "1.0"
once_cell = "1.17"
tracing = "0.1"
rayon = "1.10.0"
ahash = "0.8.12"
smallvec = "1.15.0"
chrono = "0.4"
# SHA-256 for the content grammar's digest, fed as the bytes are encoded. The
# version the lock already carries for polars-plan, so no new crate arrives.
sha2 = "0.10.9"
# Pinned to force fresh resolves past the ethnum 1.5.0 transmute bug
# (E0512 on newer rustc). 1.5.2 ships the fix. ethnum is otherwise
# transitive via polars.
ethnum = "1.5.2"
# erfc for the normal distribution function (norm_cdf, section 11.1.12). The
# version the lock already carries for num-traits and polars-ops, so no new
# crate arrives.
libm = "0.2.15"

[dev-dependencies]
criterion = "0.5"
approx = "0.5"

[[bench]]
name = "vector_plugin_benchmark"
harness = false

[[bench]]
name = "assumption_table_lookup_benchmark"
harness = false

[[bench]]
name = "list_pow"
harness = false

[[bench]]
name = "list_conditional"
harness = false

[[bench]]
name = "accumulate"
harness = false

[[bench]]
name = "realistic_vector_lookup"
harness = false

[[bench]]
name = "curve_eval"
harness = false
