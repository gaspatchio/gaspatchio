# cargo-about's configuration, for bindings/python/third-party-notices.txt:
# the notices of the Rust crates compiled into gaspatchio's extension.
# scripts/rust_notices.py runs cargo-about with it and says how the file is
# made; nothing else reads it.

# The licence each crate is taken under, when it offers a choice. MIT first:
# most crates offer it, and a crate's MIT text carries its own copyright line,
# which is the notice the licence asks copies to carry. Apache-2.0 next, for
# the crates that do not offer MIT. The rest are never offered as an
# alternative to either by any crate the extension links.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
]

# The four platforms the wheels are built for (CI.yml's manylinux, macos and
# windows jobs), then the two arm64 platforms pip builds the sdist on for want
# of a wheel: Windows, which links one crate the others do not, and Linux,
# which links none. A crate that only some of them use is listed once for all.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
]

# Tests, benchmarks and build scripts are not linked into the extension.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Read the licence files at a crate's root and nowhere else. Below the root,
# cargo-about takes any file that looks enough like a licence for the text of
# one, source files with a licence header among them, and it ignores a file
# whose licence the crate does not declare, which is what vendored code
# usually is. So a notice below the root -- a licence file, or a licence
# written out at the head of a compiled source file under a copyright the
# crate's own licence does not name -- is carried by a clarification below,
# or scripts/rust_notices.py says why it need not be.
max-depth = 1

# Crate by crate, in name order. A clarification replaces cargo-about's
# reading of the crate: it names the licence and the files that carry it, each
# held to a SHA-256 of its text, so a file that changes stops the notices
# being written rather than letting them drift. The `license` of a
# clarification is the crate's own declared licence unless a comment says
# otherwise.

# Its MIT text is set in short lines, which cargo-about scores below its
# threshold and reads as no licence at all.
[async-stream.clarify]
license = "MIT"

[[async-stream.clarify.files]]
path = "LICENSE"
checksum = "157d381f6304eba77459fc10dfb5b1b22fc0d04e384a32865f32d8e67a34c0eb"

