name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly full scan to catch newly-published CVEs against unchanged deps.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  # security-events: write would be needed to upload SARIF, but both jobs below
  # pass upload-sarif: false (GitHub Advanced Security isn't enabled on this
  # repo) so the reusable workflow's SARIF-upload step never runs. Re-add it
  # if that ever flips to true.

jobs:
  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@8deb546fdb875b9996d27d4950be7312dac076a1   # v2.5.0
    with:
      # GitHub Advanced Security / Code Scanning is not enabled on this repo,
      # so skip SARIF upload. The scan itself still runs and fails on any
      # new vulnerability introduced by the PR.
      upload-sarif: false
      # --config makes osv-scanner.toml apply to EVERY scanned lockfile. Without
      # it the scanner resolves config per scanned file's own directory, so the
      # root osv-scanner.toml covered Cargo.lock but not bindings/python/uv.lock,
      # and Python ignores were silently reported as "unused ignores".
      scan-args: |-
        --config=osv-scanner.toml
        -r
        ./

  scan-scheduled:
    if: ${{ github.event_name != 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1   # v2.5.0
    with:
      upload-sarif: false
      # Keep in sync with scan-pr above — see the --config note there.
      scan-args: |-
        --config=osv-scanner.toml
        -r
        ./
