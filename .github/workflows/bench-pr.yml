name: Benchmark PR

on:
  pull_request:
    paths: ['core/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Criterion Benchmarks (PR comparison, ${{ matrix.platform.display }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - display: Linux
            runner: ubuntu-latest
            benchmark_name: Rust Benchmarks
            benchmark_path: dev/bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          lfs: false
      - name: Pull the LFS objects this job reads
        uses: ./.github/actions/lfs-pull
        with:
          include: "core/benches/**"
          scope: rust
      - uses: dtolnay/rust-toolchain@stable   # intentionally not SHA-pinned — no `toolchain:` version is set, so this ref *is* the mechanism that tracks current stable Rust; pinning it would freeze the toolchain instead
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: bench-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
      - name: Run benchmarks
        run: cargo bench --bench assumption_table_lookup_benchmark -- --output-format bencher '(assumption_table_.*1k|hash_vs_array_1k|vector_hash_vs_array_1k|lookup_scaling/.*/1000$)' | tee bench-output.txt
        working-directory: core
      - name: Clean working tree for gh-pages switch
        run: git checkout -- .
      - name: Compare to baseline
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba   # v1
        with:
          tool: cargo
          name: ${{ matrix.platform.benchmark_name }}
          output-file-path: core/bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          benchmark-data-dir-path: ${{ matrix.platform.benchmark_path }}
          alert-threshold: '130%'
          comment-on-alert: true
          fail-on-alert: false  # Don't fail PR if no baseline exists yet
          auto-push: false  # Don't push — just compare and comment
