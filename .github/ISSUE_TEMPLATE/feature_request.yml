name: Feature request
description: Something gaspatchio should do that it doesn't today
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The actuarial task or workflow you're stuck on — the business problem, not the API you imagine solving it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like gaspatchio to do?
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How you handle this today, if at all.
    validations:
      required: false
