# Dependabot — passive security and version-update PR raising.
# Pairs with .github/workflows/security.yml (active OSV scanning on every PR).

version: 2
updates:
  # Rust core dependencies
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One grouped PR per week instead of one-per-dependency — collapses the
    # CI fan-out (each PR otherwise fires CI/CD + Security + Licence).
    groups:
      cargo:
        patterns:
          - "*"
    # Polars is held until the move to Polars 2, a release of its own. This
    # entry reads core/Cargo.toml alone, whose Polars crates sit at 0.53 beside
    # Python Polars 1.42.1, and they move together or not at all: a bump here
    # on its own would split the pin. The binding crate, which pins polars and
    # pyo3-polars as well, is under no entry, so nothing proposes a bump there.
    # Take this out when the Polars 2 work starts.
    ignore:
      - dependency-name: "polars*"
    labels:
      - dependencies
      - rust

  # Python bindings + dev deps
  - package-ecosystem: pip
    directory: /bindings/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns:
          - "*"
    # Polars is held at 1.42.1 until the move to Polars 2, for the reason the
    # cargo entry gives; its runtime packages move with it. Take this out when
    # the Polars 2 work starts.
    ignore:
      - dependency-name: "polars*"
    labels:
      - dependencies
      - python

  # GitHub Actions versions (pin action SHAs / track major upgrades)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
